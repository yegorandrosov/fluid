name: Publish SparkDynamic

# Fork-specific publishing for SparkDynamic.Fluid.Core.
#
# Uses an 'sd-v*' tag prefix rather than upstream's 'v*': syncing sebastienros/fluid
# brings in ~100 upstream 'v*' tags, and those must never trigger a publish here.
#
# Example:
#   git tag sd-v3.0.0-beta-0
#   git push origin sd-v3.0.0-beta-0

on:
  push:
    tags:
      - sd-v*
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 3.0.0-beta-0)'
        required: true

jobs:
  publish:

    runs-on: ubuntu-latest
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
        global-json-file: global.json

    - name: Resolve version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          # Strip the 'sd-v' tag prefix
          VERSION="${GITHUB_REF_NAME#sd-v}"
        fi
        echo "Publishing version $VERSION"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Test
      run: dotnet test -c Release

    - name: Pack
      # PackageId is prefixed by Directory.Build.targets, so it is not passed here.
      run: >
        dotnet pack Fluid/Fluid.csproj
        --configuration Release
        --property:PackageOutputPath=${{ github.workspace }}/artifacts
        -p:Version=${{ steps.version.outputs.version }}
        -p:ContinuousIntegrationBuild=True

    - name: Push
      run: >
        dotnet nuget push "artifacts/*.nupkg"
        --api-key ${{ secrets.NUGET_API_KEY }}
        --source https://api.nuget.org/v3/index.json
        --skip-duplicate
